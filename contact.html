<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Bryton Bergren</title>
  <link rel="stylesheet" href="style.css">
  <script src="nav.js" defer></script>
</head>
<body>

  <main>
    <h1 class="page-title">Contact Me</h1>
    <p style="color: #64748b; max-width: 600px;">
      Have a question or want to collaborate on a project? Feel free to send a message below.
    </p>

    <form class="contact-form" action="https://formspree.io/f/your-form-id" method="POST">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required placeholder="Jane Doe">
      </div>
      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" required placeholder="jane@example.com">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required placeholder="Type your message here..."></textarea>
      </div>
      <button type="submit" class="btn" style="border:none; cursor:pointer; align-self: flex-start;">Send Message</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Bryton Bergren. Hosted on GitHub Pages.</p>
  </footer>

</body>
</html>
